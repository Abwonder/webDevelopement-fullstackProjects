<style>
  /* Make the SECTION itself (with class="session-window") the backdrop overlay */
  .session-window{
    position: fixed !important;
    inset: 0 !important;
    z-index: 99999 !important;
    display: none;              /* hidden by default */
    align-items: center;
    justify-content: center;
    background: rgba(17,24,39,.45); /* slate-900/45 */
    padding: 24px;
  }
  .session-window.is-open{ display: flex; }
  /* Optional: avoid the builder showing it permanently */
  .session-window:not(.is-open){ display: none !important; }
  /* Dialog */
  .sw-dialog{
    width: min(1100px, 96vw);
    max-height: min(84vh, 100%);
    background: #fff;
    border: 1px solid #e6e8eb;
    border-radius: 14px;
    box-shadow: 0 25px 50px rgba(0,0,0,.25);
    overflow: hidden;
    transform: translateY(8px);
    animation: swFadeUp .18s ease-out;
  }
  @keyframes swFadeUp{
    from{ opacity:.6; transform: translateY(14px); }
    to  { opacity:1;  transform: translateY(8px); }
  }
  .sw-header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 12px 14px; border-bottom:1px solid #eef1f4; background:#fafafa;
  }
  .sw-title{ font-weight:700; color:#111827; }
  .sw-close{
    width:28px; height:28px; border-radius:8px;
    border:1px solid #e5e7eb; background:#fff; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .sw-close:hover{ background:#f8fafc; }
  /* Body: grid layout (Vapi left, editor right) */
  .sw-body{ padding: 16px; }
  .sess-grid{
    display:grid;
    grid-template-columns: 480px 1fr;
    gap: 16px;
    align-items: start;
  }
  /* Keep Vapi widget positioned sanely inside its card */
  vapi-widget .vapi-widget-wrapper>div{ position:relative !important; left: 0 !important; bottom: 0 !important; }
  vapi-widget .vapi-widget-wrapper>div>div{ width: 100% !important; }
  /* Editor card */
  .sess-editor-card{
    background:#fff; border:1px solid #e6e8eb; border-radius:14px;
    box-shadow:0 10px 24px rgba(0,0,0,.06); overflow:hidden;
  }
  .sess-ed-hdr{ padding:10px 12px; border-bottom:1px dashed #eaecef; color:#6b7280; }
  /* Toolbar */
  .sess-toolbar{
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    padding:10px; border-bottom:1px solid #eef1f4; background:#fafafa;
  }
  .sess-tbtn{
    appearance:none; border:1px solid #e5e7eb; background:#fff;
    width:34px; height:30px; border-radius:10px;
    display:inline-flex; align-items:center; justify-content:center;
    cursor:pointer; color:#374151;
  }
  .sess-tbtn:hover{ background:#f8fafc; }
  .sess-tbtn.is-active{ border-color:#93c5fd; box-shadow:0 0 0 3px rgba(59,130,246,.15); }
  .sess-sep{ width:1px; height:24px; background:#e6e8eb; margin:0 2px; }
  .sess-color{ position:absolute; width:0; height:0; opacity:0; pointer-events:none; }
  /* Editable area */
  .sess-editor{
    min-height: 420px; max-height: 54vh; overflow:auto;
    padding:16px; outline:none; line-height:1.6; font-size:16px; color:#111827;
  }
  .sess-editor:empty:before{ content:"Add a note"; color:#9ca3af; }
  
  /* NEW: Transcript styling ONLY */
  .transcript-entry{
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #f3f4f6;
  }
  .transcript-entry:last-child{ border-bottom: none; }
  .speaker-label{
    font-weight: 700;
    margin-bottom: 4px;
    font-size: 14px;
  }
  .speaker-patient{ color: #2563eb; }
  .speaker-doctor{ color: #059669; }
  .transcript-text{
    color: #374151;
    line-height: 1.5;
  }
  
  /* Responsive */
  @media (max-width: 960px){
    .sw-dialog{ width: min(96vw, 760px); }
    .sess-grid{ grid-template-columns: 1fr; }
  }
</style>

<div class="sw-dialog" role="dialog" aria-modal="true" aria-label="Session">
  <div class="sw-header">
    <div class="sw-title">Derme Practitioner - Free Demo</div>
    <button class="sw-close" type="button" aria-label="Close">×</button>
  </div>
  <div class="sw-body">
    <div class="sess-grid">
      <!-- LEFT: Vapi -->
      <div class="sess-vapi-card">
        <vapi-widget
          id="vapiWidget"
          public-key="e2054889-699b-4241-9260-32b5b08e62b6"
          assistant-id="a61643d8-78f3-4864-be73-356849aa53d3"
          mode="voice"
          theme="light"
          base-bg-color="#ffffff"
          accent-color="#14B8A6"
          cta-button-color="#ffffff"
          cta-button-text-color="#000000"
          border-radius="large"
          size="full"
          position="bottom-left"
          title="Dermy"
          start-button-text="Hey, Derme"
          end-button-text="End Call"
          cta-title="START SESSION"
          cta-subtitle="Derme Ready"
          chat-first-message="Hey, How can I help you today?"
          chat-placeholder=""
          voice-show-transcript="true"
          consent-required="false"
          consent-title="Terms and conditions"
          consent-content="By clicking &quot;Agree,&quot; and each time I interact with this AI agent, I consent to the recording, storage, and sharing of my communications with third-party service providers, and as otherwise described in our Terms of Service."
          consent-storage-key="vapi_widget_consent">
        </vapi-widget>
        <script src="https://unpkg.com/@vapi-ai/client-sdk-react/dist/embed/widget.umd.js" async type="text/javascript"></script>
      </div>
      <!-- RIGHT: Editor -->
      <div class="sess-editor-card">
        <div class="sess-ed-hdr">Full SOAP Note with Coding and rationale:</div>
        <div class="sess-toolbar" role="toolbar" aria-label="Editor toolbar">
          <button type="button" class="sess-tbtn" data-cmd="bold"        title="Bold"><b>B</b></button>
          <button type="button" class="sess-tbtn" data-cmd="italic"      title="Italic"><i>I</i></button>
          <button type="button" class="sess-tbtn" data-cmd="underline"   title="Underline"><u>U</u></button>
          <button type="button" class="sess-tbtn" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
          <span class="sess-sep" aria-hidden="true"></span>
          <button type="button" class="sess-tbtn" id="colorBtn" title="Text color">A</button>
          <input type="color" class="sess-color" id="colorPicker" value="#111827"/>
          <span class="sess-sep" aria-hidden="true"></span>
          <button type="button" class="sess-tbtn" data-cmd="insertUnorderedList" title="Bulleted list">• List</button>
          <button type="button" class="sess-tbtn" data-cmd="insertOrderedList"   title="Numbered list">1. List</button>
          <span class="sess-sep" aria-hidden="true"></span>
          <button type="button" class="sess-tbtn" id="linkBtn" title="Link">🔗</button>
          <button type="button" class="sess-tbtn" data-cmd="unlink" title="Unlink">⟲</button>
          <span class="sess-sep" aria-hidden="true"></span>
          <button type="button" class="sess-tbtn" data-cmd="undo" title="Undo">↶</button>
          <button type="button" class="sess-tbtn" data-cmd="redo" title="Redo">↷</button>
        </div>
        <div class="sess-editor" id="sessEditor" contenteditable="true"></div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  // ---- Modal open/close helpers ----
  const SECTION = document.querySelector('.session-window');
  const DIALOG  = SECTION?.querySelector('.sw-dialog');
  const CLOSE   = SECTION?.querySelector('.sw-close');

  let transcriptMonitor = null;

  function disableScroll(on){
    if (on){ document.documentElement.style.overflow = 'hidden'; }
    else   { document.documentElement.style.overflow = ''; }
  }

  function openSessionWindow(payload){
    if (!SECTION) return;
    SECTION.classList.add('is-open');
    disableScroll(true);
    
    initializeEditor();
    startTranscriptMonitoring();
  }
  
  function closeSessionWindow(){
    if (!SECTION) return;
    SECTION.classList.remove('is-open');
    disableScroll(false);
    
    if (transcriptMonitor) {
      clearInterval(transcriptMonitor);
    }
  }

  // Expose to global
  window.openSessionWindow  = openSessionWindow;
  window.closeSessionWindow = closeSessionWindow;

  // Close handlers
  CLOSE?.addEventListener('click', closeSessionWindow);
  SECTION?.addEventListener('click', (e) => { if (e.target === SECTION) closeSessionWindow(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && SECTION?.classList.contains('is-open')) closeSessionWindow();
  });

  // ---- Editor wiring ----
  const editor = document.getElementById('sessEditor');
  function run(cmd, val=null){ editor.focus(); try{ document.execCommand(cmd, false, val); }catch{} }
  document.querySelectorAll('.sess-tbtn[data-cmd]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const cmd = btn.getAttribute('data-cmd');
      run(cmd);
      if (['bold','italic','underline','strikeThrough'].includes(cmd)){
        btn.classList.toggle('is-active');
      }
    });
  });
  const colorBtn = document.getElementById('colorBtn');
  const colorPicker = document.getElementById('colorPicker');
  colorBtn.addEventListener('click', () => colorPicker.click());
  colorPicker.addEventListener('input', (e) => run('foreColor', e.target.value));
  const linkBtn = document.getElementById('linkBtn');
  linkBtn.addEventListener('click', () => {
    const url = prompt('Enter URL (https://…):', 'https://');
    if (url && url.trim()) run('createLink', url.trim());
  });
  document.addEventListener('selectionchange', ()=>{
    if (document.activeElement !== editor) return;
    ['bold','italic','underline','strikeThrough'].forEach(cmd=>{
      const on = document.queryCommandState(cmd);
      const el = document.querySelector(`.sess-tbtn[data-cmd="${cmd}"]`);
      if (el) el.classList.toggle('is-active', !!on);
    });
  });

  // ================== SIMPLE TRANSCRIPT MONITORING ==================
  
  function initializeEditor() {
    if (!editor) return;
    
    editor.innerHTML = `
      <div style="text-align: center; color: #6b7280; padding: 20px; font-style: italic;">
        💬 Live Conversation Transcript<br>
        <small>Voice conversation will automatically appear here...</small>
      </div>
    `;
  }
  
  function startTranscriptMonitoring() {
    // Monitor for Vapi transcript elements
    transcriptMonitor = setInterval(() => {
      captureVapiTranscripts();
    }, 1000);
  }
  
  function captureVapiTranscripts() {
    // Look for Vapi message elements in the DOM
    const userMessages = document.querySelectorAll('.flex.justify-end .markdown-content p');
    const assistantMessages = document.querySelectorAll('.flex.justify-start .markdown-content p');
    
    // Capture user messages (patient)
    userMessages.forEach((message, index) => {
      const text = message.textContent?.trim();
      if (text && text.length > 2) {
        appendToSOAPNotes('user', text, index);
      }
    });
    
    // Capture assistant messages (doctor)
    assistantMessages.forEach((message, index) => {
      const text = message.textContent?.trim();
      if (text && text.length > 2) {
        appendToSOAPNotes('assistant', text, index);
      }
    });
  }
  
  function appendToSOAPNotes(role, text, index) {
    if (!editor || !text) return;
    
    const messageId = `${role}-${index}-${text.substring(0, 20)}`;
    
    // Check if already added
    if (editor.textContent.includes(text.substring(0, 30))) {
      return;
    }
    
    const speakerLabel = role === 'user' ? 'PATIENT' : 'DR. CHEN';
    const timestamp = new Date().toLocaleTimeString();
    
    // Remove welcome message on first real message
    if (editor.querySelector('div[style*="italic"]')) {
      editor.innerHTML = '';
    }
    
    const entry = document.createElement('div');
    entry.style.cssText = 'margin-bottom: 12px; padding: 8px 12px; border-left: 4px solid #e5e7eb; background: #f9fafb; border-radius: 0 8px 8px 0;';
    
    if (role === 'user') {
      entry.style.borderLeftColor = '#3b82f6';
      entry.style.background = '#dbeafe';
    } else {
      entry.style.borderLeftColor = '#059669';
      entry.style.background = '#d1fae5';
    }
    
    const label = document.createElement('div');
    label.style.cssText = 'font-weight: 700; font-size: 13px; margin-bottom: 4px;';
    label.textContent = `${speakerLabel} • ${timestamp}`;
    
    const content = document.createElement('div');
    content.style.cssText = 'color: #374151; line-height: 1.4;';
    content.textContent = text;
    
    entry.appendChild(label);
    entry.appendChild(content);
    editor.appendChild(entry);
    
    editor.scrollTop = editor.scrollHeight;
  }

})();
</script>
